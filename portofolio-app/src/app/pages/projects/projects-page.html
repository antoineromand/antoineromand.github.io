<div class="projects-container">
  <div class="head-container">
    <div class="page-header">
      <span class="main-quote">Projets sélectionnés</span>
      <span class="sub-quote">Back-end, front-end et systèmes distribués</span>
    </div>
    <p class="resume">
      Vous retrouverez ici une sélection de projets publics représentatifs de mon travail.
      N'hésitez pas à consulter chaque dépôt sur GitHub.
    </p>
  </div>
  <section class="projects-toolbar">
    <app-projects-filter (filterOutputEvent)="getFilters($event)"></app-projects-filter>
  </section>

  <section class="projects-list">
    @for (project of projects(); track project.id; let index = $index) {
      <app-project [project]="project" [displayIndex]="index"></app-project>
    }
  </section>

  <section class="projects-toolbar projects-pagination">
    <app-projects-pagination
      [offset]="this.offset()"
      [limit]="this.limit"
      [total]="this.total()"
      (updateLastIdEvent)="getPagination($event)"
    ></app-projects-pagination>
  </section>
</div>
