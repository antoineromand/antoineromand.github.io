<article class="project-card" [class.is-reversed]="shouldReverse(displayIndex())">
  <div class="project-index">{{ project().id | idFormatter }}</div>

  <div class="project-frame">
    <div class="project-media">
      <img
        [src]="project().img.length === 0 ? defaultImgSrc : project().img"
        [alt]="project().title"
      />

      <div class="project-badge">
        <span class="badge-label">{{ status() }}</span>
        <span>{{ project().year }}</span>
      </div>
    </div>

    <div class="project-body">
      <div class="project-meta">
        <span class="project-category">{{ project().category }}</span>
        <h2 class="project-title">{{ project().title }}</h2>
        <p class="project-description">{{ project().description }}</p>
      </div>

      <div class="project-tags">
        @for (tag of project().tags; track tag) {
          <span>{{ tag }}</span>
        }
      </div>

      <a [href]="project().githubUrl" target="_blank" rel="noreferrer" class="project-link">
        Voir le dépôt
      </a>
    </div>
  </div>
</article>
