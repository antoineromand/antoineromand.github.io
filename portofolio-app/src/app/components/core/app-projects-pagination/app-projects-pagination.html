<div class="projects-pagination">
  <div class="pagination-row">
    <button
      class="pagination-button"
      (click)="previous()"
      [disabled]="isFirstPage()"
    >
      Précédent
    </button>
    <span class="pagination-status">{{ currentPage() }} / {{ totalPages() }}</span>
    <button
      class="pagination-button"
      (click)="next()"
      [disabled]="isLastPage()"
    >
      Suivant
    </button>
  </div>
</div>
